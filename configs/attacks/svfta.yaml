semantic_contract: Preserve the registered scale-view feature objective, bounded one-time score-risk repair prefix, permanent repair-stop state, and uncertainty-gated update.
implementation_note: Project method; MMDetection 3.x implementation uses a bounded one-time score-risk repair prefix (risk_warmup is the maximum repair-update count and stops permanently once the threshold is satisfied), the differentiable public score surface (pre-NMS class probabilities when post-NMS scores are empty or detached), strict-null diagnostics if neither surface exists, and scale-view feature decorrelation.
