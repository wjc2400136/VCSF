  vcsf_single_source_operator_factorial:
    method: vcsf_operator_factorial_isolated
    protocol: vcsf_single_source_operator_factorial_research
    description: Complete three-binary-factor operator study at fixed half-width 1/3.
    base_study: vcsf_finalization_layered
    base_variant: levels_two
    half_width: 1/3
    factor_order: [image_interpolation, placement, image_padding]
    factor_levels:
      image_interpolation: [bilinear, nearest]
      placement: [random, center]
      image_padding: [reflect, zero]
    variants:
      A: {parameters: {image_interpolation: bilinear, placement: random, image_padding: reflect}}
      B: {parameters: {image_interpolation: bilinear, placement: center, image_padding: reflect}}
      C: {parameters: {image_interpolation: bilinear, placement: random, image_padding: zero}}
      D: {parameters: {image_interpolation: nearest, placement: random, image_padding: reflect}}
      E: {parameters: {image_interpolation: bilinear, placement: center, image_padding: zero}}
      F: {parameters: {image_interpolation: nearest, placement: center, image_padding: reflect}}
      G: {parameters: {image_interpolation: nearest, placement: random, image_padding: zero}}
      H: {parameters: {image_interpolation: nearest, placement: center, image_padding: zero}}
    row_order: [A, B, C, D, E, F, G, H]
    historical_reference_variants: {A: A_h2, B: B_h2, C: C_h2, D: D_h2}
    requested_new_variants: [E, F, G, H]
    historical_reuse_policy: exact_identity_and_complete_qualified_evidence_before_partition
    historical_failure_policy: unresolved_not_automatic_new_run
    blocks:
      operators:
        variants: [A, B, C, D, E, F, G, H]
        seeds: [42]
        allowed_fields: [image_interpolation, placement, image_padding]
    analysis_policy:
      metric: bbox_mAP
      scalar: equal_weight_source_excluded_cells
      anchor: A
      primary_seed: 42
      factorials:
        - block: operators
          low: A
          high: H
          axes:
            image_interpolation: [image_interpolation]
            placement: [placement]
            image_padding: [image_padding]
          seeds: [42]
      anchor_comparisons: every_nonanchor_variant_at_primary_seed
      additional_pairs: []
      coefficient_convention: unnormalized_active_axis_finite_difference_averaged_over_inactive_axes
      expected_contrasts: {averaged_factorial: 7, conditional_factorial: 18, anchor: 7, total: 32}
      uncertainty:
        bootstrap_required: false
        significance_claimed: false
        confidence_intervals_produced: false
        independent_confirmation: false
        selection_adjusted_inference: false
      selection:
        automatic_promotion: false
        complete_target_panel_required: true
        decision: keep_change_or_reject_with_AP_cost_complexity
        positive_effect_required: false
        width_search_reopened: false
        final_author_freeze_required: true
    planning_totals_before_reuse:
      source_groups: 8
      generated_image_instances: 40000
      target_evaluations: 128
    conditional_new_work_after_four_qualified_reuses:
      source_groups: 4
      generated_image_instances: 20000
      target_evaluations: 64
