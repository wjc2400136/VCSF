      momentum_040: {parameters: {momentum: 4/10}}
      momentum_055: {parameters: {momentum: 55/100}}
      momentum_085: {parameters: {momentum: 85/100}}
      momentum_100: {parameters: {momentum: 1}}
    execution_order: [core, feature_coverage, matched_terms, initialization_specificity, correspondence, objective_simplicity, spatial_support, centering_momentum, momentum_sensitivity]
    blocks:
      core:
        variants: [neck_identity_none, neck_scale_none, cross_identity_none, cross_scale_none, neck_identity_detector, neck_scale_detector, cross_identity_detector, full]
        seeds: [42]
        purpose: Scale by stage by initializer schedule factorial on the same baseline.
        allowed_fields: [scale_min, scale_max, surface, initialization]
      feature_coverage:
        variants: [levels_one, full, levels_three, neck_scale_detector, backbone_two]
        seeds: [42]
        purpose: Nested original layer subsets and stage coverage; count is not held constant here.
        allowed_fields: [surface, levels_per_stage]
      matched_terms:
        variants: [neck_scale_detector, backbone_two, levels_one]
        seeds: [42]
        purpose: Neck two, backbone two and cross-stage one plus one, each with two feature terms.
        allowed_fields: [surface, levels_per_stage]
        equal_fields: [initialization, iterations, scale_min, scale_max, momentum, correspondence, spatial_weight, aggregation, gradient_centering, support, image_interpolation, placement, image_padding]
        feature_terms: 2
      initialization_specificity:
        variants: [full, none_19_features, cross_scale_none, random_19_features, random_20_features]
        seeds: [42]
        purpose: Separate equal post-initialization feature updates from equal logical-gradient ceilings.
        allowed_fields: [initialization, iterations]
        schedules:
          full: {risk_updates: 1, feature_updates: 19}
          none_19_features: {risk_updates: 0, feature_updates: 19}
          cross_scale_none: {risk_updates: 0, feature_updates: 20}
          random_19_features: {risk_updates: 0, feature_updates: 19}
          random_20_features: {risk_updates: 0, feature_updates: 20}
      correspondence:
        variants: [full, independent_offsets, independent_geometry]
