        purpose: Shared geometry versus controlled correspondence violations.
        allowed_fields: [correspondence]
      objective_simplicity:
        variants: [uniform_mean, energy_mean, uniform_log_mean_exp, full]
        seeds: [42]
        purpose: Spatial weight by feature aggregation factorial.
        allowed_fields: [spatial_weight, aggregation]
      spatial_support:
        variants: [full, all_model_locations]
        seeds: [42]
        purpose: Valid input support versus all model locations, separate from weighting.
        allowed_fields: [support]
      centering_momentum:
        variants: [uncentered_zero, momentum_zero, uncentered_gradient, full]
        seeds: [42]
        purpose: Gradient centering by zero versus baseline momentum factorial.
        allowed_fields: [gradient_centering, momentum]
      momentum_sensitivity:
        variants: [momentum_zero, momentum_040, momentum_055, full, momentum_085, momentum_100]
        seeds: [42]
        purpose: Centered-gradient one-dimensional momentum sensitivity.
        allowed_fields: [momentum]
