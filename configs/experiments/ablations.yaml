  svfta_scale_risk_objective_search:
    method: svfta
    description: >-
      Development-only paired comparison of the exact scale+risk reference
      against a fixed two-step normalized cumulative-hazard initialization.
      Both variants disable the uncertainty gate while preserving the same
      first-moment feature optimizer, scale range, 4/255 radius and exactly
      twenty source-detector backward evaluations.
    variants:
      legacy_scale_risk: {parameters: {uncertainty_kappa: 0}}
      cumulative_hazard: {parameters: {uncertainty_kappa: 0, risk_objective: cumulative_hazard}}
  svfta_scale_risk_isolated_search:
    method: svfta
    description: >-
      Development-only isolated screen of equal-instance spatial weighting and
      smooth extremal log-odds risk against one shared exact scale+risk
      reference. Candidates are not combined. Every variant disables the
      uncertainty gate and retains 4/255, twenty iterations and exactly
      twenty source-detector backward evaluations.
    variants:
      legacy_scale_risk: {parameters: {uncertainty_kappa: 0}}
