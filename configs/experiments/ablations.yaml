      metric: bbox_mAP
      scalar: equal_weight_source_excluded_cells
      anchor: full
      primary_seed: 42
      factorials:
        - block: core
          low: neck_identity_none
          high: full
          axes: {scale: [scale_min, scale_max], stage: [surface], initializer_schedule: [initialization]}
          seeds: [42]
        - block: objective_simplicity
          low: uniform_mean
          high: full
          axes: {energy_weight: [spatial_weight], log_mean_exp: [aggregation]}
          seeds: [42]
        - block: centering_momentum
          low: uncentered_zero
          high: full
          axes: {centering: [gradient_centering], momentum: [momentum]}
          seeds: [42]
      anchor_comparisons: every_nonanchor_variant_at_primary_seed
      additional_pairs:
        - {block: matched_terms, candidate: levels_one, reference: neck_scale_detector, seeds: [42]}
        - {block: matched_terms, candidate: levels_one, reference: backbone_two, seeds: [42]}
        - {block: matched_terms, candidate: backbone_two, reference: neck_scale_detector, seeds: [42]}
        - {block: initialization_specificity, candidate: full, reference: none_19_features, seeds: [42]}
        - {block: initialization_specificity, candidate: full, reference: random_19_features, seeds: [42]}
        - {block: initialization_specificity, candidate: none_19_features, reference: cross_scale_none, seeds: [42]}
        - {block: initialization_specificity, candidate: random_19_features, reference: random_20_features, seeds: [42]}
        - {block: initialization_specificity, candidate: random_20_features, reference: cross_scale_none, seeds: [42]}
      uncertainty:
        status: not_armed_requires_new_bound_prediction_index_and_family_lock
        unit: image_with_all_annotations_and_detections
        paired: true
        attack_seed_estimand: conditional_on_seed42
        selection_adjusted_inference: false
        independent_confirmation: false
      selection:
        automatic_promotion: false
        complete_target_panel_required: true
        decision: keep_change_or_reject_with_AP_cost_complexity
        combine_winning_settings_automatically: false
        positive_effect_required: false
        final_consistency_passes: 1
        changed_baseline_requires_rebinding: true
    planning_totals_before_reuse:
      unique_variants: 27
      source_groups: 27
      generated_image_instances: 135000
      target_evaluations: 432
