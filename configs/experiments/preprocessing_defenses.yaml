schema_version: 1
benchmark: coco_retained500_common2_preprocessing_defense
threat_model:
  knowledge: oblivious
  adaptation: none
  placement: victim_input_before_detector_preprocessor
  note: >-
    Adversarial examples are reused exactly as generated by the accepted
    coco_all_methods run. The attacker has no knowledge of the selected
    preprocessing transform and no BPDA, EOT, query adaptation, retraining or
    defended-checkpoint access is permitted.
implementation:
  input_color_space: RGB
  output_format: PNG
  jpeg_subsampling: 0
  jpeg_optimize: false
  jpeg_progressive: false
  resize_interpolation: bilinear
  resize_roundtrip: original_to_scaled_to_original
  bit_depth_rule: round_to_uniform_levels_per_rgb_channel
adaptive_attack:
  threat_model:
    knowledge: white_box_defense_aware
    adaptation: source_pipeline_bpda
    placement: known_preprocessing_before_source_detector_preprocessor
    target_access: none
    note: >-
      Each source-method-defense payload is regenerated from the same clean
      retained image IDs. The attacker knows the fixed source-side
      preprocessing transform and differentiates through the composed
      preprocessing-to-source-detector pipeline. Target detectors, target
      checkpoints, target gradients and target queries are never exposed.
  epsilon_reference: original_clean_rgb
  budget_accounting: >-
    The method's registered complete source-gradient image-equivalent cap is
    unchanged. BPDA changes only the derivative of the frozen preprocessing
    operation and does not add an uncounted source-detector backward pass.
  stochasticity: none
  eot_samples: 1
  forward_fidelity: frozen_deployment_transform
  bpda_rules:
    identity: exact_autograd
    jpeg: exact_pillow_forward_identity_backward
    bit_depth: exact_uniform_quantization_identity_backward
    gaussian: exact_pillow_forward_normalized_gaussian_backward
    median: exact_pillow_forward_identity_backward
    resize_roundtrip: exact_pillow_forward_bilinear_backward
  no_result_dependent_surrogate_selection: true
  seed_schedule: full_val_numeric_image_position
  seed_schedule_note: >-
    The per-image attack seed is the registered base seed plus the image's
    position in the complete numeric-ID-ordered COCO val2017 split. This
    preserves the accepted main-transfer seed assignment for the retained
    IDs and keeps the schedule identical across all defense variants.
variant_order:
  - identity
  - jpeg_q90
  - jpeg_q75
  - jpeg_q50
  - bit_depth_6
  - bit_depth_4
  - gaussian_sigma_1_2
  - gaussian_sigma_1
  - median_k3
  - resize_3_4
  - resize_5_4
variants:
  identity:
    label: Identity
    family: identity
    kind: identity
  jpeg_q90:
    label: JPEG-90
    family: jpeg
    kind: jpeg
    quality: 90
  jpeg_q75:
    label: JPEG-75
    family: jpeg
    kind: jpeg
    quality: 75
  jpeg_q50:
    label: JPEG-50
    family: jpeg
    kind: jpeg
    quality: 50
  bit_depth_6:
    label: Bit-6
    family: bit_depth
    kind: bit_depth
    bits: 6
  bit_depth_4:
    label: Bit-4
    family: bit_depth
    kind: bit_depth
    bits: 4
  gaussian_sigma_1_2:
    label: Gaussian-0.5
    family: smoothing
    kind: gaussian
    radius: 1/2
  gaussian_sigma_1:
    label: Gaussian-1.0
    family: smoothing
    kind: gaussian
    radius: 1
  median_k3:
    label: Median-3
    family: smoothing
    kind: median
    size: 3
  resize_3_4:
    label: Resize-0.75
    family: resize_roundtrip
    kind: resize_roundtrip
    scale: 3/4
  resize_5_4:
    label: Resize-1.25
    family: resize_roundtrip
    kind: resize_roundtrip
    scale: 5/4
