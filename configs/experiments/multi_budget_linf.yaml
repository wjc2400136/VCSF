    approved_patch_sha256: 784b27a58119f94b3fbb67f9813d9cab8f7382be3c8d0d11958a75753150f7c9
    adjudication: >-
      Attack implementations, attack registries, detector registry and metric
      definitions are byte-identical to the accepted generation commit. The
      approved shared-code diff only adds optional input/checkpoint/image-ID/
      progress hooks whose defaults preserve the original full-val path; the
      noninteractive progress change does not alter predictions or metrics.
controlled_factor:
  changed_parameter: eps
  frozen_parameters:
    - step_size
    - iterations
    - optimizer
    - transform_distribution
    - source_objective
    - seed
    - gradient_accounting
  rationale: >-
    A one-factor sensitivity study must not silently co-vary the update size or
    compute. The achieved perturbation norm and perceptual quality are reported
    so under-utilisation of a larger upper bound remains observable.
