schema_version: 1
benchmark: coco_fullval2017_common2_multi_budget_linf_zero_query_transfer
status: superseded_by_20260826_method_fidelity_revision
supersession_reason: >-
  The accepted source run and the multi-budget campaign used the pre-refresh
  SFIM-B learning rate and the stage-adapted Mask-Swin NAA executor. The current
  SFIM-B and NAA definitions are not implementation-equivalent, and NAA no
  longer has native Mask-Swin support. This immutable historical protocol must
  not be resumed or regenerated with current code; freeze a successor only
  after the COCO-1000 method-fidelity refresh and a new 4/255 formal source run.
