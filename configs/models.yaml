    table_code: TOOD
    framework: mmdet
    family: dense_task_aligned
    backbone: R-50
    source: false
    held_out: false
    config: configs/tood/tood_r50_fpn_1x_coco.py
    checkpoint: https://download.openmmlab.com/mmdetection/v2.0/tood/tood_r50_fpn_1x_coco/tood_r50_fpn_1x_coco_20211210_103425-20e20746.pth
