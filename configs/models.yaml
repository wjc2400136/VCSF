    table_code: RTMDet
    framework: mmyolo
    family: real_time_dense
    backbone: CSPNeXt
    source: false
    held_out: false
    config: configs/rtmdet/rtmdet_s_syncbn_fast_8xb32-300e_coco.py
    checkpoint: https://download.openmmlab.com/mmyolo/v0/rtmdet/rtmdet_s_syncbn_fast_8xb32-300e_coco/rtmdet_s_syncbn_fast_8xb32-300e_coco_20221230_182329-0a8c901a.pth
    coco_box_ap: 44.6
    finetune_epochs: {voc: 50, bdd100k: 50}
