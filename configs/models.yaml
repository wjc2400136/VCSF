    family: yolo_dense
    backbone: CSPD
    source: false
    held_out: false
    config: configs/yolox/yolox_s_fast_8xb8-300e_coco.py
    checkpoint: https://download.openmmlab.com/mmyolo/v0/yolox/yolox_s_fast_8xb8-300e_coco/yolox_s_fast_8xb8-300e_coco_20230213_142600-2b224d8b.pth
    coco_box_ap: 40.7
    finetune_epochs: {voc: 50, bdd100k: 50}
