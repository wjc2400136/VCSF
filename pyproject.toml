[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lgp-benchmark"
version = "3.0.0"
description = "Reproducible transfer attacks against object detectors"
readme = "README.md"
requires-python = ">=3.8,<3.9"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 (GPLv3)"]
authors = [{name = "LGP research project"}]
dependencies = [
  "PyYAML==6.0.1",
  "jsonschema==4.21.1",
  "numpy==1.24.4",
  "pandas==2.0.3",
  "Pillow==10.4.0",
  "requests==2.32.3",
  "rich==13.7.1",
  "tqdm==4.66.5",
  "matplotlib==3.7.5",
  "scikit-image==0.21.0",
]

[project.optional-dependencies]
quality = [
  "lpips==0.1.4",
  "scipy==1.10.1",
]
test = [
  "pytest==8.3.5",
  "pytest-cov==5.0.0",
]

[project.scripts]
lgp = "lgp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
